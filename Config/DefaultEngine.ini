; Virtual Shadow Maps
r.Shadow.Virtual.Enable=1

; Anti-Aliasing
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1

; Motion Blur (reduced for streaming clarity)
r.MotionBlurQuality=3
r.MotionBlur.Amount=0.3

; Subsurface Scattering for skin
r.SSS.SampleSet=2
r.SSS.Quality=1

; Hair Rendering
r.HairStrands.Enable=1
r.HairStrands.Strands.RenderOIT=1

; Depth of Field
r.DepthOfFieldQuality=2

; Eye Adaptation
r.EyeAdaptation.EditorOnly=0

; Screen Percentage (base before upscaling)
r.ScreenPercentage=100

